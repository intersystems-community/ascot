version: 2
multi-ecosystem-groups:
  deps:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: deps
    patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: deps
    patterns: ["*"]

  - package-ecosystem: npm
    directory: /bindings/js
    multi-ecosystem-group: deps
    patterns: ["*"]
