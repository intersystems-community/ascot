name: Declarations

# Builds an IRIS Community release's pre-built declaration file and uploads it, with its
# checksum, to the `declarations` release that `--iris <release>` downloads from.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The iris-community image tag, e.g. 2026.2
        required: true
        default: '2026.2'

permissions:
  contents: write

jobs:
  declare:
    runs-on: ubuntu-latest
    env:
      NAME: iris-community-${{ inputs.release }}.d.json
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Declare
        run: |
          scripts/prebuilt-declarations.sh ${{ inputs.release }} $NAME
          gzip -9 $NAME
          sha256sum $NAME.gz > $NAME.gz.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view declarations >/dev/null 2>&1 || gh release create declarations --title "Pre-built declarations" --notes "The pre-built declaration files of the IRIS Community releases: \`--iris <release>\` downloads one into ~/.ascot on first use."
          gh release upload declarations "$NAME.gz" "$NAME.gz.sha256" --clobber
