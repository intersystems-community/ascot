name: Declarations

# Builds a Community release's pre-built declaration file and uploads it, with its checksum, to
# the `declarations` release that `--iris <release>` downloads from.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The image tag, e.g. 2026.2
        required: true
        default: '2026.2'
      image:
        description: The image, iris-community or irishealth-community
        required: true
        default: 'iris-community'
      namespace:
        description: The namespace, %SYS or, for IRIS for Health's HS and Ens classes, HSLIB
        required: true
        default: '%SYS'

permissions:
  contents: write

jobs:
  declare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Declare
        run: |
          NAME=${{ inputs.image }}-${{ inputs.release }}.d.json
          [ "${{ inputs.namespace }}" = %SYS ] || NAME=${{ inputs.image }}-${{ inputs.release }}.${{ inputs.namespace }}.d.json
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          scripts/prebuilt-declarations.sh ${{ inputs.release }} $NAME ${{ inputs.image }} ${{ inputs.namespace }}
          gzip -9 $NAME
          sha256sum $NAME.gz > $NAME.gz.sha256
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view declarations >/dev/null 2>&1 || gh release create declarations --prerelease --latest=false --title "Pre-built IRIS declarations" --notes-file .github/declarations-release.md
          gh release upload declarations "$NAME.gz" "$NAME.gz.sha256" --clobber
