name: Parse coverage

# Every class, routine and include file IRIS ships must parse. The two namespaces that hold them,
# IRIS Community's %SYS and IRIS for Health Community's HSLIB (which has all of HSSYS and more), are
# exported from the release's image and run through `ascot analyze` for the two syntax codes,
# A1727 and A8073; one line of either fails the job. %SYS is checked on every pull request, in the
# merge queue and on every push to main, as a required check; HSLIB, twice as long, on Sundays at
# midnight Eastern and on dispatch.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      release:
        description: The image tag, e.g. 2026.2
        required: true
        default: '2026.2'

permissions:
  contents: read

# One run per event and ref, so a push to main doesn't cancel the Sunday run.
concurrency:
  group: parse-coverage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sys:
    name: parse %SYS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Export %SYS of iris-community and parse it
        run: scripts/parse-coverage.sh '${{ inputs.release || '2026.2' }}' iris-community '%SYS'

  hslib:
    name: parse HSLIB
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Export HSLIB of irishealth-community and parse it
        run: scripts/parse-coverage.sh '${{ inputs.release || '2026.2' }}' irishealth-community HSLIB
