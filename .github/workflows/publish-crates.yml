# Publishes the workspace crates from a chosen ref by hand: for a release whose `publish-crates`
# job failed after the tag was cut and the fix landed on main at the same version.
name: Publish crates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `tygr-objectscript-macros` is a path dependency of `tygr-objectscript`, which is one of
      # `ascot`; `--workspace` publishes them in that order and waits for the index between each.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
