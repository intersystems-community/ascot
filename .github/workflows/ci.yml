name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # `--all-targets` above skips doctests (a cargo quirk, not an oversight) — run them too.
      - name: Doc tests
        run: cargo test --doc

      - name: WASM build
        run: cargo build --target=wasm32-unknown-unknown --release --lib

  iris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The image's default passwords come expired: every request is a 401 until they're not.
      - name: Start IRIS
        run: |
          docker run -d --name iris -p 52773:52773 containers.intersystems.com/intersystems/iris-community:2026.1
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:52773/api/atelier/; do sleep 2; done'
          docker exec iris iris session IRIS -U %SYS '##class(Security.Users).UnExpireUserPasswords("*")'

      - name: Test
        run: cargo test --test iris
        env:
          ASCOT_TEST_IRIS: http://_SYSTEM:SYS@localhost:52773

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the JavaScript binding
        working-directory: bindings/js
        run: |
          npm ci
          bash scripts/build.sh
          npm test
        env:
          ASCOT_TEST_IRIS: http://_SYSTEM:SYS@localhost:52773

  npm-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install devDependencies
        working-directory: bindings/js
        run: npm ci

      - name: Format
        working-directory: bindings/js
        run: npm run format:check

      - name: Build (wasm -> jco -> tsc)
        working-directory: bindings/js
        run: bash scripts/build.sh

      - name: Pack
        working-directory: bindings/js
        run: npm pack --dry-run

      # What `release.yml` publishes to npm, so the package shipped is the one tested here.
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            bindings/js/dist
            bindings/js/generated
            bindings/js/lib/*.core*.wasm
          if-no-files-found: error

  # Only humans are accountable for this work, so an AI credit in a commit or the PR is noise.
  no-ai-attribution:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject AI attribution in the commits and the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic|copilot|chatgpt|openai|gemini|cursor|codex)|generated (with|by).*(claude|copilot|chatgpt|openai|gemini|cursor|codex)|🤖'
          if { git log --format=%B "$BASE..$HEAD"; printf '%s\n' "$BODY"; } | grep -inE "$pattern"; then
            echo "::error::Drop the AI attribution above; only humans are accountable for this work."
            exit 1
          fi
