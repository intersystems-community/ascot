name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: The diagnostics reference in docs/unreleased is current
        run: |
          cargo run -q -- diagnostics /tmp/unreleased
          diff -r /tmp/unreleased docs/unreleased \
            || { echo 'docs/unreleased is stale: run `cargo run -- diagnostics docs/unreleased` and commit it'; exit 1; }

      # A release PR bumps the version; the same PR ships that version's reference.
      - name: A version bump ships its diagnostics reference
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          git fetch -q --depth=1 origin main
          base=$(git show origin/main:Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          [ "$version" = "$base" ] && exit 0
          test -d "docs/$version" || { echo "docs/$version is missing: cp -r docs/unreleased docs/$version, and list it in docs/index.md"; exit 1; }
          diff -r docs/unreleased "docs/$version"
          grep -q "($version/)" docs/index.md || { echo "docs/index.md does not list $version"; exit 1; }

      - name: Test
        run: cargo test --workspace --all-targets

      # A library host takes the checker alone, or with any one flag; the CLI can be `analyze` alone.
      - name: Feature gates
        run: |
          for features in "" analyze declare lsp mcp network; do
            cargo clippy --lib --no-default-features ${features:+--features "$features"} -- -D warnings
          done
          cargo clippy --bin ascot --no-default-features --features analyze -- -D warnings
          cargo test --lib --no-default-features

      # `--all-targets` above skips doctests (a cargo quirk, not an oversight) — run them too.
      - name: Doc tests
        run: cargo test --doc

      - name: WASM build
        run: cargo build --target=wasm32-unknown-unknown --release --lib --no-default-features

  iris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The image's default passwords come expired: every request is a 401 until they're not.
      - name: Start IRIS
        run: |
          docker run -d --name iris -p 52773:52773 containers.intersystems.com/intersystems/iris-community:2026.1
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:52773/api/atelier/; do sleep 2; done'
          docker exec iris iris session IRIS -U %SYS '##class(Security.Users).UnExpireUserPasswords("*")'

      - name: Test
        run: cargo test --test iris
        env:
          ASCOT_TEST_IRIS: http://_SYSTEM:SYS@localhost:52773

      # What each diagnostic's message claims about IRIS, tried on the examples in its doc comment.
      - name: Verify the diagnostics' examples against IRIS
        run: python3 -I scripts/verify-examples.py --iris http://_SYSTEM:SYS@localhost:52773 --run "docker exec -i iris iris session IRIS -U USER"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the JavaScript binding
        working-directory: bindings/js
        run: |
          npm ci
          bash scripts/build.sh
          npm test
        env:
          ASCOT_TEST_IRIS: http://_SYSTEM:SYS@localhost:52773

  npm-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install devDependencies
        working-directory: bindings/js
        run: npm ci

      - name: Format
        working-directory: bindings/js
        run: npm run format:check

      - name: Build (wasm -> jco -> tsc)
        working-directory: bindings/js
        run: bash scripts/build.sh

      # `createWorkspace()` reads the bundled declarations by default: the package must carry them.
      - name: Pack
        working-directory: bindings/js
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          python3 -c "import json, sys; files = {f['path'] for f in json.load(open('/tmp/pack.json'))[0]['files']}; sys.exit(0 if 'lib/declarations.js' in files and any(f.endswith('.d.json.gz') for f in files) else 'the package lacks its declarations: ' + ', '.join(sorted(files)))"

      # What `release.yml` publishes to npm, so the package shipped is the one tested here.
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            bindings/js/dist
            bindings/js/generated
            bindings/js/lib/*.d.json.gz
            bindings/js/lib/*.js
            bindings/js/lib/*.d.ts
          if-no-files-found: error

  # Only humans are accountable for this work, so an AI credit in a commit or the PR is noise.
  no-ai-attribution:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject AI attribution in the commits and the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic|copilot|chatgpt|openai|gemini|cursor|codex)|generated (with|by).*(claude|copilot|chatgpt|openai|gemini|cursor|codex)|🤖'
          if { git log --format=%B "$BASE..$HEAD"; printf '%s\n' "$BODY"; } | grep -inE "$pattern"; then
            echo "::error::Drop the AI attribution above; only humans are accountable for this work."
            exit 1
          fi
