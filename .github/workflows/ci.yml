name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      # `--all-targets` above skips doctests (a cargo quirk, not an oversight) — run them too.
      - name: Doc tests
        run: cargo test --doc

      - name: WASM build
        run: cargo build --target=wasm32-unknown-unknown --release --lib

  iris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The image's default passwords come expired: every request is a 401 until they're not.
      - name: Start IRIS
        run: |
          docker run -d --name iris -p 52773:52773 containers.intersystems.com/intersystems/iris-community:2026.1
          timeout 300 bash -c 'until curl -s -o /dev/null http://localhost:52773/api/atelier/; do sleep 2; done'
          docker exec iris iris session IRIS -U %SYS '##class(Security.Users).UnExpireUserPasswords("*")'

      - name: Test
        run: cargo test --test iris
        env:
          ASCOT_TEST_IRIS: http://_SYSTEM:SYS@localhost:52773

  npm-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install devDependencies
        working-directory: bindings/js
        run: npm ci

      - name: Format
        working-directory: bindings/js
        run: npm run format:check

      - name: Build (wasm -> jco -> tsc)
        working-directory: bindings/js
        run: bash scripts/build.sh

      - name: Pack
        working-directory: bindings/js
        run: npm pack --dry-run
