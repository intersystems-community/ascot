name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: ascot

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: universal-apple-darwin
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            cargo build --release --bin $BIN --target aarch64-apple-darwin --target x86_64-apple-darwin
            mkdir -p "target/${{ matrix.target }}/release"
            lipo -create -output "target/${{ matrix.target }}/release/$BIN" \
              target/{aarch64,x86_64}-apple-darwin/release/$BIN
          else
            cargo build --release --bin $BIN --target ${{ matrix.target }}
          fi

      - name: Package binary
        shell: bash
        run: |
          name="$BIN-cli-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "./target/${{ matrix.target }}/release/$BIN.exe"
          else
            tar czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # One job publishes the release, so the generated notes appear once and all assets land together.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

      - name: Open a Homebrew tap PR
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          version=${GITHUB_REF_NAME#v}
          url=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
          git clone -q "https://x-access-token:$GH_TOKEN@github.com/$TAP" tap
          current=$(grep -o -m1 'download/v[^/]*' tap/Formula/$BIN.rb | cut -c11- || true)
          if [ "$(printf '%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ] || [ "$current" = "$version" ]; then
            echo "The tap already has $BIN $current; not replacing it with $version"
            exit 0
          fi
          cat > tap/Formula/$BIN.rb <<FORMULA
          class Ascot < Formula
            desc "Type checker and code intelligence engine for InterSystems ObjectScript"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            version "$version"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              url "$url/$BIN-cli-universal-apple-darwin.tar.gz"
              sha256 "$(shasum -a 256 $BIN-cli-universal-apple-darwin.tar.gz | cut -c1-64)"
            end

            on_linux do
              on_intel do
                url "$url/$BIN-cli-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(shasum -a 256 $BIN-cli-x86_64-unknown-linux-gnu.tar.gz | cut -c1-64)"
              end
              on_arm do
                url "$url/$BIN-cli-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(shasum -a 256 $BIN-cli-aarch64-unknown-linux-gnu.tar.gz | cut -c1-64)"
              end
            end

            def install
              bin.install "$BIN"
            end

            test do
              assert_match "$BIN $version", shell_output("#{bin}/$BIN --version")
            end
          end
          FORMULA
          cd tap
          if git ls-remote --exit-code --heads origin $BIN-$version >/dev/null; then
            echo "Branch $BIN-$version already exists; reusing it"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git checkout -q -b $BIN-$version
            git commit -qam "Bump $BIN to $version"
            git push -q origin HEAD
          fi
          if [ -z "$(gh pr list --head $BIN-$version --json number -q '.[]')" ]; then
            gh pr create --fill --base master --head $BIN-$version
          fi

  publish-crates:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `tygr-objectscript` is a path dependency of `ascot`; `--workspace` publishes
      # it first and waits for the index before publishing `ascot`.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install devDependencies
        working-directory: bindings/js
        run: npm ci

      - name: Build (wasm -> jco -> tsc)
        working-directory: bindings/js
        run: bash scripts/build.sh

      - name: Stage
        working-directory: bindings/js
        run: npm stage publish --provenance
