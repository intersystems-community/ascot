name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: ascot

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: universal-apple-darwin
            os: macos-latest
            targets: aarch64-apple-darwin, x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            cargo build --release --bin $BIN --target aarch64-apple-darwin --target x86_64-apple-darwin
            mkdir -p "target/${{ matrix.target }}/release"
            lipo -create -output "target/${{ matrix.target }}/release/$BIN" \
              target/{aarch64,x86_64}-apple-darwin/release/$BIN
          else
            cargo build --release --bin $BIN --target ${{ matrix.target }}
          fi

      - name: Package binary
        shell: bash
        run: |
          name="$BIN-cli-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "./target/${{ matrix.target }}/release/$BIN.exe"
          else
            tar czf "$name.tar.gz" -C "target/${{ matrix.target }}/release" "$BIN"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # One job publishes the release, so the generated notes appear once and all assets land together.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
