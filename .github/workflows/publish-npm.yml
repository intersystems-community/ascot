name: Publish npm package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  # npm trusted publishing: the job's OIDC token stands in for a long-lived npm token.
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install devDependencies
        working-directory: bindings/js
        run: npm ci

      - name: Build (wasm -> jco -> tsc)
        working-directory: bindings/js
        run: bash scripts/build.sh

      # Staged, not live: a maintainer approves it on npmjs.com (Staged Packages) with 2FA.
      # Unlike `npm publish`, staging doesn't add provenance unless asked.
      - name: Stage
        working-directory: bindings/js
        run: npm stage publish --provenance
