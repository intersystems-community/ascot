name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ascot version
      description: Crate version or git commit.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, and how ascot was installed, e.g. macOS 26 (Homebrew), Windows 11 (release binary), Ubuntu 24.04 (cargo install).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal input that triggers the problem. Code snippets and screenshots help most.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What do you expect?
    validations:
      required: false
