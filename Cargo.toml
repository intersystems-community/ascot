[workspace]
members = ["tygr-objectscript"]

[package]
name = "ascot"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A type checker and code intelligence engine for InterSystems ObjectScript, usable as a CLI, an LSP or MCP server, or a library."
repository = "https://github.com/intersystems-community/ascot"
exclude = [".github", ".claude-plugin", "bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
either = "1.15.0"
tygr = "0.6.0"
tygr-objectscript = { version = "0.2.0", path = "tygr-objectscript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
wit-bindgen = "0.62.0"
schemars = "1.2.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
lsp-server = "0.10"
lsp-types = "0.97"
url = "2"
percent-encoding = "2"
ureq = { version = "3", features = ["json"] }
base64 = "0.23"
