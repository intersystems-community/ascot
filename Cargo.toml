[workspace]
members = ["tygr-objectscript"]

[package]
name = "ascot"
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A type checker and code intelligence engine for InterSystems ObjectScript, usable as a CLI, an LSP or MCP server, or a library."
repository = "https://github.com/intersystems-community/ascot"
exclude = [".github", ".claude-plugin", "bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ascot"
path = "src/main.rs"
required-features = ["analyze"]

# A host that uses ascot as a library takes the checker alone (`default-features = false`): a
# workspace, declaration files, releases already in `~/.ascot`, and the `Atelier` trait for a
# connection of its own. Each flag adds one subcommand of the CLI, or the network.
[features]
default = ["analyze", "declare", "lsp", "mcp", "network"]
# `ascot analyze`: the CLI, with SARIF output and the JSON report.
analyze = ["dep:clap"]
# `ascot declare`: writing a declaration file from a live instance, which needs the network.
declare = ["dep:clap", "network"]
# `ascot lsp`, the stdio Language Server (`ascot::lsp`).
lsp = ["dep:clap", "dep:lsp-server", "dep:lsp-types"]
# `ascot mcp`, the stdio MCP server (`ascot::mcp`).
mcp = ["dep:clap", "dep:rmcp", "dep:tokio"]
# ascot reaching the network itself: a live IRIS instance over its Atelier REST API (`RawAtelier`,
# `--iris http://...`) and a release's pre-built declarations from the project's GitHub release
# (`--iris latest`). A host with its own transport implements `Atelier` without it.
network = ["dep:ureq", "dep:sha2", "dep:base64", "dep:percent-encoding"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
either = "1.15.0"
tygr = "0.7.0"
tygr-objectscript = { version = "0.5.1", path = "tygr-objectscript" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
wit-bindgen = "0.63.0"
schemars = "1.2.2"
flate2 = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmcp = { version = "3.1.2", features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
url = "2"
percent-encoding = { version = "2", optional = true }
ureq = { version = "3", features = ["json", "platform-verifier", "cookies"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.23", optional = true }
clap = { version = "4.6.7", features = ["derive", "wrap_help"], optional = true }

[patch.crates-io]
tygr = { git = "https://github.com/intersystems-community/tygr", rev = "94a49f5" }
