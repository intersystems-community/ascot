[package]
name = "tygr-objectscript-macros"
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The #[levels] attribute of tygr-objectscript: a tygr grammar defined once and produced with and without its syntactic sugar"
repository = "https://github.com/intersystems-community/ascot"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
